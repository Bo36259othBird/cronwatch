[metadata]
name = cronwatch
version = 0.1.0
description = Lightweight daemon that monitors cron job execution, logs durations, and sends alerts on failures or unexpected silences.
author = cronwatch developers
license = MIT

[options]
packages = find:
python_requires = >=3.11
install_requires =
    tomli>=2.0; python_version < "3.11"

[options.extras_require]
dev =
    pytest>=7.0
    pytest-cov

[options.entry_points]
console_scripts =
    cronwatch = cronwatch.cli:main

[tool:pytest]
testpaths = tests
addopts = --tb=short

[flake8]
max-line-length = 100
exclude = .git,__pycache__,.venv
